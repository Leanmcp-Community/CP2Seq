<text x="129.5" y="125" font-size="12.5" fill="#1565c0" font-weight="600">蓝线（状态数）比橙线（耗时）陡</text>
<text x="129.5" y="145" font-size="12.5" fill="#666">这个斜率差就是可利用的缝</text>
<text x="95" y="554" font-size="12" fill="#c62828" font-weight="600">⚠ 典型的 101–300 面 CP 只有约 100 个终态，不是天文数字 —— 爆炸在长尾（p90 带很宽），不在中位数</text>
<text x="95" y="574" font-size="11.5" fill="#888">⚠ 终态数 ≠ 折叠序列数。序列空间可能大得多。这张图是代理量，不是答案。</text>
</svg>
