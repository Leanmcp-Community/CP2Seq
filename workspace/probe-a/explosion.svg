<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" height="600" font-family="-apple-system,Helvetica,Arial,sans-serif"><rect width="940" height="600" fill="#fff"/>
<text x="95" y="36" font-size="19" font-weight="700">折纸越大，搜索空间和验证成本各自涨多快</text>
