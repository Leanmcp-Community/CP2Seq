<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="Helvetica, Arial, sans-serif">
<title>Search baseline solve rate by coupling, at fixed fold depth</title>
<desc>Per-sample solve rate for the deterministic breadth-first baseline, split by coupling below and above 4, at depths 8, 9, 10.</desc>
<rect width="520" height="330" fill="#ffffff"/>
<line x1="52" y1="242.0" x2="506" y2="242.0" stroke="#e3e3e3" stroke-width="0.8" stroke-dasharray="0"/>
<text x="46" y="245.5" font-size="9" fill="#444" text-anchor="end">0%</text>
<line x1="52" y1="186.5" x2="506" y2="186.5" stroke="#e3e3e3" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="46" y="190.0" font-size="9" fill="#444" text-anchor="end">25%</text>
<line x1="52" y1="131.0" x2="506" y2="131.0" stroke="#e3e3e3" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="46" y="134.5" font-size="9" fill="#444" text-anchor="end">50%</text>
<line x1="52" y1="75.5" x2="506" y2="75.5" stroke="#e3e3e3" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="46" y="79.0" font-size="9" fill="#444" text-anchor="end">75%</text>
<line x1="52" y1="20.0" x2="506" y2="20.0" stroke="#e3e3e3" stroke-width="0.8" stroke-dasharray="3 3"/>
<text x="46" y="23.5" font-size="9" fill="#444" text-anchor="end">100%</text>
<rect x="86.7" y="20.0" width="40.0" height="222.0" fill="#2a78d6" opacity="0.9"/>
<text x="106.7" y="16.0" font-size="8.5" fill="#333" text-anchor="middle">13/13</text>
<rect x="128.7" y="89.4" width="40.0" height="152.6" fill="#eb6834" opacity="0.9"/>
<text x="148.7" y="85.4" font-size="8.5" fill="#333" text-anchor="middle">11/16</text>
<rect x="238.0" y="64.4" width="40.0" height="177.6" fill="#2a78d6" opacity="0.9"/>
<text x="258.0" y="60.4" font-size="8.5" fill="#333" text-anchor="middle">8/10</text>
<rect x="280.0" y="186.5" width="40.0" height="55.5" fill="#eb6834" opacity="0.9"/>
<text x="300.0" y="182.5" font-size="8.5" fill="#333" text-anchor="middle">5/20</text>
<rect x="389.3" y="94.0" width="40.0" height="148.0" fill="#2a78d6" opacity="0.9"/>
<text x="409.3" y="90.0" font-size="8.5" fill="#333" text-anchor="middle">4/6</text>
<rect x="431.3" y="212.4" width="40.0" height="29.6" fill="#eb6834" opacity="0.9"/>
<text x="451.3" y="208.4" font-size="8.5" fill="#333" text-anchor="middle">2/15</text>
<text x="127.7" y="258.0" font-size="10" fill="#333" text-anchor="middle">8 folds</text>
<text x="279.0" y="258.0" font-size="10" fill="#333" text-anchor="middle">9 folds</text>
<text x="430.3" y="258.0" font-size="10" fill="#333" text-anchor="middle">10 folds</text>
<line x1="52" y1="242.0" x2="506" y2="242.0" stroke="#444" stroke-width="0.8"/>
<text x="279.0" y="274.0" font-size="10.5" fill="#333" text-anchor="middle">fold depth (held fixed within each pair)</text>
<text x="14" y="131.0" font-size="10.5" fill="#333" text-anchor="middle" transform="rotate(-90 14 131.0)">samples solved</text>
<g font-size="9" fill="#444">
<rect x="52" y="284" width="9" height="9" fill="#2a78d6"/><text x="66" y="292">coupling &lt; 4</text>
<rect x="202" y="284" width="9" height="9" fill="#eb6834"/><text x="216" y="292">coupling ≥ 4</text>
</g>
<text x="52" y="308" font-size="8.5" fill="#999">Bars carry samples solved over samples attempted, counted once per sample rather than once per attempt.</text>
<text x="52" y="319" font-size="8.5" fill="#999">Depths below 8 are omitted: the baseline solves them at any coupling, so they say nothing about it.</text>
</svg>
